name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android & Android TV APKs?"
        type: boolean
        default: true
      build_linux:
        description: "Build Linux PC?"
        type: boolean
        default: true
      build_windows:
        description: "Build Windows PC?"
        type: boolean
        default: true
      notify_discord:
        description: "Send Discord Notification?"
        type: boolean
        default: true
      notify_everyone:
        description: "Ping @everyone on Discord?"
        type: boolean
        default: true
      include_logs:
        description: "Include run logs link in notification?"
        type: boolean
        default: true
      is_prerelease:
        description: "Is this a pre-release?"
        type: boolean
        default: false
      tag_name:
        description: "Release tag ('auto', 'latest', 'main', or specific)"
        type: string
        default: "auto"

permissions:
  contents: write

jobs:
  resolve-release-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      clean_version: ${{ steps.resolve.outputs.clean_version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          INPUT_IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          requested="${REQUESTED_TAG:-auto}"
          requested="$(echo "$requested" | xargs)"

          tag_exists_or_released() {
            local tag="$1"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1
          }

          latest_alpha_for_base() {
            local prefix="$1"
            {
              git tag --list "${prefix}-alpha.*"
              gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null || true
            } | sed -n "s/^$(printf '%s' "$prefix" | sed 's/[.[\*^$()+?{}|\\]/\\&/g')-alpha\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1
          }

          if [ "${{ github.ref_type }}" = "tag" ]; then
            resolved="$GITHUB_REF_NAME"
          elif [ -z "$requested" ] || [ "$requested" = "auto" ] || [ "$requested" = "main" ]; then
            version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
            if [ -z "$version" ]; then
              echo "Could not read version from pubspec.yaml" >&2
              exit 1
            fi

            base_tag="v$version"
            if tag_exists_or_released "$base_tag"; then
              major_minor="${version%.*}"
              patch="${version##*.}"
              next_patch=$((patch + 1))
              next_tag="v${major_minor}.${next_patch}"

              # If the user explicitly requested a pre-release, use alpha tagging
              if [ "$INPUT_IS_PRERELEASE" = "true" ]; then
                last_alpha="$(latest_alpha_for_base "$next_tag")"
                if [ -z "$last_alpha" ]; then
                  resolved="${next_tag}-alpha.1"
                else
                  resolved="${next_tag}-alpha.$((last_alpha + 1))"
                fi
              else
                # For push-to-main or default dispatch: bump patch directly as a full release
                # If the bumped tag also exists, keep incrementing
                while tag_exists_or_released "$next_tag"; do
                  next_patch=$((next_patch + 1))
                  next_tag="v${major_minor}.${next_patch}"
                done
                resolved="$next_tag"
              fi
            else
              resolved="$base_tag"
            fi
          else
            resolved="$requested"
          fi

          prerelease="$INPUT_IS_PRERELEASE"
          case "$resolved" in
            v*-*) prerelease="true" ;;
          esac

          clean_ver="${resolved#v}"

          echo "Resolved release tag: $resolved"
          echo "Clean version: $clean_ver"
          echo "tag_name=$resolved" >> "$GITHUB_OUTPUT"
          echo "clean_version=$clean_ver" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build-android:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init packages/commentum_client || true
          git submodule update --init lib/source_engine/inbuilt_sources || echo "inbuilt_sources submodule unavailable (private/fork upstream). Continuing..."

      - name: Override pubspec.yaml version
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.clean_version }}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: "gradle"

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: true

      - name: Setup Keystore & Signing Configuration
        run: |
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD || 'kurox_release_key_2026' }}"
          STORE_PASS="${{ secrets.ANDROID_STORE_PASSWORD || 'kurox_release_key_2026' }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'kurox' }}"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using provided repository secrets keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            STORE_FILE="upload-keystore.jks"
          elif [ -f "android/app/kurox-release.jks" ]; then
            echo "Using permanent KuroX repository release keystore..."
            STORE_FILE="kurox-release.jks"
          else
            echo "No custom keystore secret found. Generating permanent release keystore for CI signing..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=KuroX, OU=Mobile, O=KuroX App, L=San Francisco, S=CA, C=US"
            STORE_FILE="upload-keystore.jks"
          fi

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=$STORE_FILE
          EOF

      - name: Create env file
        run: |
          ANILIST_ID="${{ secrets.ANILIST_CLIENT_ID }}"
          ANILIST_ID="${ANILIST_ID:-51784|51784}"
          ANILIST_SECRET="${{ secrets.ANILIST_CLIENT_SECRET }}"
          ANILIST_SECRET="${ANILIST_SECRET:-}"
          MAL_ID="${{ secrets.MAL_CLIENT_ID }}"
          MAL_ID="${MAL_ID:-281bee8ed86f5e410705a2243c359761|281bee8ed86f5e410705a2243c359761}"
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${ANILIST_ID}",
            "ANILIST_CLIENT_SECRET": "${ANILIST_SECRET}",
            "MAL_CLIENT_ID": "${MAL_ID}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "${{ github.repository }}"
          }
          EOF

      - name: Get Dependencies
        run: |
          for i in 1 2 3 4 5; do
            echo "Running flutter pub get (attempt $i/5)..."
            flutter pub get && break || (echo "pub get failed, retrying in 10s..." && sleep 10)
          done

      - name: Build Split-per-ABI APKs (Mobile & TV)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define-from-file=keys.json

      - name: Build Universal APK (Universal Android & Android TV)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define-from-file=keys.json

      - name: Prepare & Rename Android & Android TV Artifacts
        run: |
          TAG="${{ needs.resolve-release-tag.outputs.tag_name }}"
          mkdir -p output-apks
          
          # Universal APK (Ideal for Android TV sideloading & generic devices)
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "output-apks/KuroX-${TAG}-android-universal.apk"
          fi
          
          # Architecture-specific APKs
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "output-apks/KuroX-${TAG}-android-arm64-v8a.apk"
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "output-apks/KuroX-${TAG}-android-armeabi-v7a.apk"
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk "output-apks/KuroX-${TAG}-android-x86_64.apk"
          fi

          ls -lah output-apks/

      - name: Upload Android & Android TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: output-apks/*.apk

  build-linux:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install system dependencies & optimize Arch container
        run: |
          pacman -Syu --noconfirm git jq zip unzip curl xz tar clang cmake ninja pkgconf gtk3 libsecret webkit2gtk-4.1 wpewebkit libwpe wpebackend-fdo mpv alsa-lib rustup
          pacman -Scc --noconfirm

      - name: Setup Rust toolchain (Linux)
        run: rustup default stable

      - name: Trust git directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init packages/commentum_client || true
          git submodule update --init lib/source_engine/inbuilt_sources || echo "inbuilt_sources submodule unavailable (private/fork upstream). Continuing..."

      - name: Override pubspec.yaml version
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.clean_version }}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: false

      - name: Create env file
        run: |
          ANILIST_ID="${{ secrets.ANILIST_CLIENT_ID }}"
          ANILIST_ID="${ANILIST_ID:-51784|51784}"
          ANILIST_SECRET="${{ secrets.ANILIST_CLIENT_SECRET }}"
          ANILIST_SECRET="${ANILIST_SECRET:-}"
          MAL_ID="${{ secrets.MAL_CLIENT_ID }}"
          MAL_ID="${MAL_ID:-281bee8ed86f5e410705a2243c359761|281bee8ed86f5e410705a2243c359761}"
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${ANILIST_ID}",
            "ANILIST_CLIENT_SECRET": "${ANILIST_SECRET}",
            "MAL_CLIENT_ID": "${MAL_ID}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "${{ github.repository }}"
          }
          EOF

      - name: Enable Linux config
        run: flutter config --enable-linux-desktop

      - name: Clean stale build directory
        run: rm -rf build

      - name: Get Dependencies
        run: |
          for i in 1 2 3 4 5; do
            echo "Running flutter pub get (attempt $i/5)..."
            flutter pub get && break || (echo "pub get failed, retrying in 10s..." && sleep 10)
          done

      - name: Build Linux app
        run: flutter build linux --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define-from-file=keys.json

      - name: Package Linux PC Artifacts
        run: |
          TAG="${{ needs.resolve-release-tag.outputs.tag_name }}"
          mkdir -p output-linux
          cd build/linux/x64/release/bundle
          zip -r "../../../../../output-linux/KuroX-${TAG}-linux-x86_64.zip" .
          tar -czvf "../../../../../output-linux/KuroX-${TAG}-linux-x86_64.tar.gz" .
          cd ../../../../../
          ls -lah output-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: output-linux/*

  build-windows:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Init specific submodules
        shell: bash
        run: |
          git submodule update --init packages/commentum_client || true
          git submodule update --init lib/source_engine/inbuilt_sources || echo "inbuilt_sources submodule unavailable (private/fork upstream). Continuing..."

      - name: Override pubspec.yaml version
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.clean_version }}"
          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi
          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - name: Setup Rust toolchain (Windows)
        uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: true

      - name: Enable Windows config
        shell: bash
        run: flutter config --enable-windows-desktop

      - name: Create env file
        shell: bash
        run: |
          ANILIST_ID="${{ secrets.ANILIST_CLIENT_ID }}"
          ANILIST_ID="${ANILIST_ID:-51784|51784}"
          ANILIST_SECRET="${{ secrets.ANILIST_CLIENT_SECRET }}"
          ANILIST_SECRET="${ANILIST_SECRET:-}"
          MAL_ID="${{ secrets.MAL_CLIENT_ID }}"
          MAL_ID="${MAL_ID:-281bee8ed86f5e410705a2243c359761|281bee8ed86f5e410705a2243c359761}"
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${ANILIST_ID}",
            "ANILIST_CLIENT_SECRET": "${ANILIST_SECRET}",
            "MAL_CLIENT_ID": "${MAL_ID}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "${{ github.repository }}"
          }
          EOF

      - name: Get Dependencies
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "Running flutter pub get (attempt $i/5)..."
            flutter pub get && break || (echo "pub get failed, retrying in 10s..." && sleep 10)
          done

      - name: Build Windows app
        shell: bash
        run: |
          flutter build windows --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define-from-file=keys.json || {
            echo "First build failed (likely due to media_kit libmpv download race condition). Retrying..."
            flutter build windows --release --obfuscate --split-debug-info=build/symbols --tree-shake-icons --dart-define-from-file=keys.json
          }

      - name: Build Installer (InnoBundle)
        shell: bash
        run: dart run inno_bundle --release --no-app

      - name: Package Windows PC Artifacts (Setup & Portable)
        shell: bash
        run: |
          TAG="${{ needs.resolve-release-tag.outputs.tag_name }}"
          mkdir -p output-windows
          
          # Installer .exe
          if compgen -G "build/windows/x64/installer/Release/*.exe" > /dev/null; then
            cp build/windows/x64/installer/Release/*.exe "output-windows/KuroX-${TAG}-windows-setup.exe"
          fi
          
          # Portable .zip
          if [ -d "build/windows/x64/runner/Release" ]; then
            cd build/windows/x64/runner/Release
            7z a "../../../../../output-windows/KuroX-${TAG}-windows-portable.zip" .
            cd ../../../../../
          fi

          ls -lah output-windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output-windows/*

  create-release:
    needs: [resolve-release-tag, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all finalized artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Release Notes
        id: release_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CURRENT_TAG: ${{ needs.resolve-release-tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$CURRENT_TAG" >/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 "refs/tags/$CURRENT_TAG^" 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "Comparing $PREV_TAG..HEAD"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)")
            COMPARE_LINK="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          else
            echo "No previous tag found, getting recent commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 30)
            COMPARE_LINK=""
          fi

          NOTES=""
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            PROMPT="You are a professional software release manager. Format the following git commit messages into minimal, clean, professional Markdown release notes for version ${CURRENT_TAG}.

          Rules:
          1. Keep it minimal and professional.
          2. Focus ONLY on user-facing app features, bug fixes, UI/UX enhancements, and app improvements. Completely EXCLUDE any CI/CD, GitHub Actions, workflow, build configuration, or internal script changes.
          3. Group related user-facing changes logically (e.g., Features, Bug Fixes, Improvements) if applicable, or use clean bullet points.
          4. DO NOT deviate significantly from what the commit messages say. Do not invent features or exaggerate changes.
          5. Avoid using too many emojis (at most 1-2 subtle section icons, or none at all).
          6. Return ONLY the Markdown text for the release notes without any introductory or concluding remarks from the AI.

          Commits:
          ${COMMITS}"

            PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{"text": $prompt}]}]}')

            call_gemini() {
              local model="$1"
              curl -s -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD"
            }

            for MODEL in "gemini-2.5-flash" "gemini-3.5-flash" "gemini-2.5-pro" "gemini-1.5-flash"; do
              RESPONSE=$(call_gemini "$MODEL")
              NOTES=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
              if [ -n "$NOTES" ]; then break; fi
            done
          fi

          if [ -z "$NOTES" ]; then
            NOTES="## What's Changed\n\n$COMMITS"
          fi

          if [ -n "$COMPARE_LINK" ]; then
            NOTES="$NOTES\n\n---\n**Full Changelog**: $COMPARE_LINK"
          fi

          echo -e "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release-tag.outputs.tag_name }}
          name: KuroX ${{ needs.resolve-release-tag.outputs.tag_name }}
          draft: false
          prerelease: ${{ needs.resolve-release-tag.outputs.is_prerelease == 'true' }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release is Published (Not Draft)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release-tag.outputs.tag_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Ensuring release $TAG is finalized and not left as a draft..."
            if compgen -G "release-artifacts/*" > /dev/null; then
              gh release upload "$TAG" release-artifacts/* --clobber || true
            fi
            gh release edit "$TAG" --draft=false || true
          fi

      - name: Send Discord Release Notification
        if: github.event_name == 'push' || github.event.inputs.notify_discord == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ needs.resolve-release-tag.outputs.tag_name }}
          NOTIFY_EVERYONE: ${{ github.event.inputs.notify_everyone }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Skipping Discord notification: Webhook missing."
            exit 0
          fi
          
          REPO_URL="https://github.com/${{ github.repository }}"
          RELEASE_URL="${REPO_URL}/releases/download/${TAG}"
          
          # Truncate changelog safely for Discord embed
          CHANGELOG=$(head -c 1500 release_notes.md 2>/dev/null || echo "Release $TAG compiled successfully.")
          
          # Build Download Links strictly from compiled release artifacts
          LINKS=""
          cd release-artifacts
          for f in *; do
            if [ -f "$f" ]; then
              LINKS="${LINKS}\n• [${f}](${RELEASE_URL}/${f})"
            fi
          done
          
          MENTION=""
          if [ "$NOTIFY_EVERYONE" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            MENTION="@everyone "
          fi
          
          BODY="${MENTION}**KuroX Release Compiled: ${TAG}**\n\n**Changelog:**\n${CHANGELOG}\n\n**Direct Asset Downloads:**${LINKS}\n\n[View on GitHub](${RELEASE_URL})"
          PAYLOAD=$(jq -n --arg content "$BODY" '{content: $content}')
          
          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"