name: Release Build

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      build_android:
        type: boolean
        default: true
      build_linux:
        type: boolean
        default: true
      build_windows:
        type: boolean
        default: true
      build_macos:
        type: boolean
        default: true
      build_ios:
        type: boolean
        default: true
      notify_discord:
        description: "Send Discord Notification?"
        type: boolean
        default: true
      notify_everyone:
        description: "Ping @everyone on Discord?"
        type: boolean
        default: true
      is_prerelease:
        description: "Is this a pre-release?"
        type: boolean
        default: false
      tag_name:
        description: "Release tag ('auto', 'latest', 'main', or specific)"
        type: string
        default: "auto"

permissions:
  contents: write

jobs:
  resolve-release-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          INPUT_IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.is_prerelease || false }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          requested="${REQUESTED_TAG:-auto}"
          requested="$(echo "$requested" | xargs)"

          tag_exists_or_released() {
            local tag="$1"
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1
          }

          latest_alpha_for_base() {
            local prefix="$1"
            {
              git tag --list "${prefix}-alpha.*"
              gh release list --limit 200 --json tagName -q '.[].tagName' 2>/dev/null || true
            } | sed -n "s/^$(printf '%s' "$prefix" | sed 's/[.[\*^$()+?{}|\\]/\\&/g')-alpha\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1
          }

          if [ "${{ github.event_name }}" = "push" ]; then
            resolved="$GITHUB_REF_NAME"
          elif [ -z "$requested" ] || [ "$requested" = "auto" ]; then
            version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' pubspec.yaml | cut -d+ -f1)"
            if [ -z "$version" ]; then
              echo "Could not read version from pubspec.yaml" >&2
              exit 1
            fi

            base_tag="v$version"
            if tag_exists_or_released "$base_tag"; then
              major_minor="${version%.*}"
              patch="${version##*.}"
              next_patch=$((patch + 1))
              alpha_base="v${major_minor}.${next_patch}"
              last_alpha="$(latest_alpha_for_base "$alpha_base")"
              if [ -z "$last_alpha" ]; then
                resolved="${alpha_base}-alpha.1"
              else
                resolved="${alpha_base}-alpha.$((last_alpha + 1))"
              fi
            else
              resolved="$base_tag"
            fi
          else
            resolved="$requested"
          fi

          prerelease="$INPUT_IS_PRERELEASE"
          case "$resolved" in
            v*-*) prerelease="true" ;;
          esac

          echo "Resolved release tag: $resolved"
          echo "tag_name=$resolved" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build-android:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 packages/anymex_extension_bridge packages/flutter_web_auth packages/commentum_client packages/byte_me packages/media_kit

      - name: Override pubspec.yaml version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.tag_name }}"
          CLEAN_VER="${CLEAN_VER#v}" 

          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi

          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: "gradle"

      - name: Setup Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1 
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "roshancodespace/ShonenX"
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=keys.json

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*-release.apk

  build-linux:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Install system dependencies & optimize Arch container
        run: |
          pacman -Sy --needed --noconfirm git jq zip unzip curl xz tar clang cmake ninja pkgconf gtk3 libsecret webkit2gtk-4.1 mpv alsa-lib rustup flatpak flatpak-builder
          pacman -Scc --noconfirm

      - name: Setup Rust toolchain (Linux)
        run: rustup default stable

      - name: Trust git directory
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 packages/anymex_extension_bridge packages/flutter_web_auth packages/commentum_client packages/byte_me packages/media_kit

      - name: Override pubspec.yaml version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.tag_name }}"
          CLEAN_VER="${CLEAN_VER#v}"

          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi

          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1 
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "roshancodespace/ShonenX"
          }
          EOF

      - name: Enable Linux config
        run: flutter config --enable-linux-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --dart-define-from-file=keys.json

      - name: Zip Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../ShonenX-linux.zip .

      - name: Create Linux AppImage
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="AppDir"

          EXE_PATH=$(find $BUNDLE_DIR -maxdepth 1 -type f -executable -not -name "*.so")
          EXE_NAME=$(basename "$EXE_PATH")
          echo "Found executable: $EXE_NAME"

          mkdir -p $APPDIR
          cp -r $BUNDLE_DIR/* $APPDIR/

          cat << EOF > $APPDIR/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export LD_LIBRARY_PATH="\${HERE}/lib:\${LD_LIBRARY_PATH}"
          exec "\${HERE}/$EXE_NAME" "\$@"
          EOF
          chmod +x $APPDIR/AppRun

          cat << EOF > $APPDIR/$EXE_NAME.desktop
          [Desktop Entry]
          Version=1.0
          Name=ShonenX
          Exec=$EXE_NAME
          Icon=$EXE_NAME
          Type=Application
          Terminal=false
          Categories=Utility;
          EOF

          if [ -f "linux/application_icon.png" ]; then
            cp linux/application_icon.png $APPDIR/$EXE_NAME.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > $APPDIR/$EXE_NAME.png
          fi

          curl -sLO https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ./appimagetool-x86_64.AppImage --appimage-extract-and-run $APPDIR ShonenX-linux-x86_64.AppImage

      - name: Build Flatpak
        run: |
          rm -rf flatpak/bundle
          mkdir -p flatpak/bundle
          cp -r build/linux/x64/release/bundle/* flatpak/bundle/

          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47

          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --repo=repo build-dir flatpak/com.roshancodespace.shonenx.yml
          flatpak build-bundle repo ShonenX-linux-x86_64.flatpak com.roshancodespace.shonenx

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            ShonenX-linux.zip
            ShonenX-linux-x86_64.AppImage
            ShonenX-linux-x86_64.flatpak

  build-windows:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 packages/anymex_extension_bridge packages/flutter_web_auth packages/commentum_client packages/byte_me packages/media_kit

      - name: Override pubspec.yaml version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.tag_name }}"
          CLEAN_VER="${CLEAN_VER#v}"

          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi

          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - name: Setup Rust toolchain (Windows)
        uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1 
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable Windows config
        run: flutter config --enable-windows-desktop

      - name: Create env file
        shell: bash
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "roshancodespace/ShonenX"
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows app
        shell: pwsh
        run: |
          flutter build windows --release --dart-define-from-file=keys.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "First build failed. Retrying with verbose logs..."
            flutter build windows --release --verbose --dart-define-from-file=keys.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create Windows Portable Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "ShonenX-windows-portable.zip" -Force

      - name: Build installer (InnoBundle)
        run: dart run inno_bundle --release --no-app

      - name: Copy Windows Installer to root
        shell: pwsh
        run: |
          Copy-Item "build/windows/x64/installer/Release/*.exe" -Destination "."
          Get-ChildItem -Path . -Filter "*.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            *.exe
            ShonenX-windows-portable.zip

  build-macos:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_macos == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 packages/anymex_extension_bridge packages/flutter_web_auth packages/commentum_client packages/byte_me packages/media_kit

      - name: Override pubspec.yaml version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.tag_name }}"
          CLEAN_VER="${CLEAN_VER#v}"

          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi

          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i '' -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - name: Setup Rust toolchain (macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1 
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-rust

      - name: Cache Pub & CocoaPods dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Enable macOS config
        run: flutter config --enable-macos-desktop

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "roshancodespace/ShonenX"
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release --dart-define-from-file=keys.json

      - name: Zip macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../ShonenX-macOS.zip *.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: ShonenX-macOS.zip

  build-ios:
    needs: resolve-release-tag
    if: github.event_name == 'push' || github.event.inputs.build_ios == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Init specific submodules
        run: |
          git submodule update --init --depth 1 --jobs 4 packages/anymex_extension_bridge packages/flutter_web_auth packages/commentum_client packages/byte_me packages/media_kit

      - name: Override pubspec.yaml version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CLEAN_VER="${{ needs.resolve-release-tag.outputs.tag_name }}"
          CLEAN_VER="${CLEAN_VER#v}"

          EXISTING_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "$EXISTING_VER" == *"+"* ]] && [[ "$CLEAN_VER" != *"+"* ]]; then
            BUILD_NUM="+${EXISTING_VER#*+}"
            CLEAN_VER="${CLEAN_VER}${BUILD_NUM}"
          fi

          echo "Overriding pubspec.yaml version to: $CLEAN_VER"
          sed -i '' -e "s/^version: .*/version: $CLEAN_VER/g" pubspec.yaml

      - name: Setup Rust toolchain (iOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1 
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-rust

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-rust

      - name: Cache Pub & CocoaPods dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Create env file
        run: |
          cat > keys.json <<EOF
          {
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANILIST_CLIENT_SECRET": "${{ secrets.ANILIST_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "COMMENTUM_API_URL": "${{ secrets.COMMENTUM_API_URL }}",
            "RELEASE_REPO": "roshancodespace/ShonenX"
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS app (Unsigned)
        run: flutter build ios --release --no-codesign --dart-define-from-file=keys.json

      - name: Package iOS IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv *.app Payload/
          zip -qq -r ../../../ShonenX-iOS-Unsigned.ipa Payload

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ShonenX-iOS-Unsigned.ipa

  create-release:
    needs:
      [
        resolve-release-tag,
        build-android,
        build-linux,
        build-windows,
        build-macos,
        build-ios,
      ]
    runs-on: ubuntu-latest
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all finalized artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Flatten release artifacts
        run: |
          find release-artifacts -mindepth 2 -type f -exec mv -t release-artifacts/ {} +
          find release-artifacts -mindepth 1 -type d -empty -delete
          echo "Verified release artifacts:"
          ls -lh release-artifacts

      - name: Generate Release Notes
        id: release_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CURRENT_TAG: ${{ needs.resolve-release-tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$CURRENT_TAG" >/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 "refs/tags/$CURRENT_TAG^" 2>/dev/null || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "Comparing $PREV_TAG..HEAD"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)")
            COMPARE_LINK="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
          else
            echo "No previous tag found, getting recent commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" -n 30)
            COMPARE_LINK=""
          fi

          NOTES=""
          if [ -n "$GEMINI_API_KEY" ]; then
            PROMPT="You are writing release notes for ShonenX ${CURRENT_TAG} in the voice of the solo dev: grounded, concise, slightly dry/sarcastic like a real human developer, NOT generic AI marketing copy.

          Rules:
          1. Sound human, casual-professional, and slightly witty/dry — never use AI slop phrases like 'thrilled to announce', 'elevate your experience', 'seamless', 'delve', 'under the hood', or 'exciting update'.
          2. Stay strictly faithful to the commit messages. Do not invent or exaggerate anything.
          3. Include ONLY user-facing changes (features, bug fixes, UI/UX, performance). Drop CI, workflow, build, chore, and internal refactor noise unless it directly affects users.
          4. Format for both GitHub and Discord Embeds: use only '### Section' headers (e.g. '### What\'s New', '### Fixes', '### Performance') and '- ' bullet points. No tables, no HTML, no '---' dividers.
          5. Keep emojis to 0 (or at most 1 if it genuinely fits dry humor, never spam).
          6. Output ONLY the release notes Markdown, no intro or outro.

          Commits:
          ${COMMITS}"

            PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{contents: [{parts: [{"text": $prompt}]}]}')

            call_gemini() {
              local model="$1"
              curl -s -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" || true
            }

            for MODEL in "gemini-2.5-flash" "gemini-2.5-flash-lite" "gemini-2.5-pro"; do
              RESPONSE=$(call_gemini "$MODEL")
              NOTES=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || true)
              if [ -n "$NOTES" ]; then break; fi
            done
          fi

          if [ -z "$NOTES" ]; then
            NOTES=$(python3 - "$COMMITS" <<'PY'
          import re, sys

          lines = [l.strip() for l in sys.argv[1].splitlines() if l.strip()]
          groups = {"Features": [], "Fixes": [], "Performance": []}
          pattern = re.compile(r'^-\s*(feat|fix|perf)(?:\(([^)]+)\))?!?:\s*(.+)$', re.IGNORECASE)

          for line in lines:
              m = pattern.match(line)
              if not m:
                  continue
              kind, scope, msg = m.group(1).lower(), m.group(2), m.group(3)
              bullet = f"- **{scope}:** {msg}" if scope else f"- {msg}"
              if kind == "feat":
                  groups["Features"].append(bullet)
              elif kind == "fix":
                  groups["Fixes"].append(bullet)
              elif kind == "perf":
                  groups["Performance"].append(bullet)

          sections = []
          for title, items in groups.items():
              if items:
                  sections.append(f"### {title}\n" + "\n".join(items))

          if sections:
              print("\n\n".join(sections))
          else:
              print("### Changes\n" + "\n".join(lines[:15]))
          PY
          )
          fi

          if [ -n "$COMPARE_LINK" ]; then
            NOTES="${NOTES}"$'\n\n'"**Full Changelog:** ${COMPARE_LINK}"
          fi

          printf '%s\n' "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release-tag.outputs.tag_name }}
          name: ${{ needs.resolve-release-tag.outputs.tag_name }}
          prerelease: ${{ needs.resolve-release-tag.outputs.is_prerelease == 'true' }}
          body_path: release_notes.md
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification
        if: github.event_name == 'push' || github.event.inputs.notify_discord == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ needs.resolve-release-tag.outputs.tag_name }}
          NOTIFY_EVERYONE: ${{ github.event.inputs.notify_everyone }}
          IS_PRERELEASE: ${{ needs.resolve-release-tag.outputs.is_prerelease }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Skipping Discord notification: Webhook missing."
            exit 0
          fi

          REPO_URL="https://github.com/${{ github.repository }}"
          RELEASE_PAGE_URL="${REPO_URL}/releases/tag/${TAG}"
          RELEASE_DL_URL="${REPO_URL}/releases/download/${TAG}"

          # Safely truncate changelog to fit Discord embed description limit (4096 chars)
          CHANGELOG=$(head -c 3500 release_notes.md)
          if [ "$(wc -c < release_notes.md)" -gt 3500 ]; then
            CHANGELOG="${CHANGELOG}..."$'\n\n'"[Read full release notes](${RELEASE_PAGE_URL})"
          fi

          # Build clean download links using real newlines
          LINKS=""
          cd release-artifacts
          for f in *; do
            if [ -f "$f" ]; then
              LINKS="${LINKS}• [${f}](${RELEASE_DL_URL}/${f})"$'\n'
            fi
          done
          LINKS="${LINKS%$'\n'}"
          if [ ${#LINKS} -gt 1024 ]; then
            LINKS="[View all release downloads](${RELEASE_PAGE_URL})"
          fi

          MENTION=""
          if [ "$NOTIFY_EVERYONE" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            MENTION="@everyone"
          fi

          TITLE="ShonenX ${TAG} Released"
          if [ "$IS_PRERELEASE" = "true" ]; then
            TITLE="ShonenX ${TAG} (Pre-release)"
          fi

          PAYLOAD=$(jq -n \
            --arg content "$MENTION" \
            --arg title "$TITLE" \
            --arg url "$RELEASE_PAGE_URL" \
            --arg desc "$CHANGELOG" \
            --arg links "${LINKS:-No assets attached.}" \
            '{
              content: $content,
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 5793266,
                fields: [{
                  name: "Direct Asset Downloads",
                  value: $links
                }]
              }]
            }')

          HTTP_CODE=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK")
          echo "Discord webhook status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 400 ]; then
            cat /tmp/discord_resp.txt
            exit 1
          fi
