# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json
app-id: com.roshancodespace.shonenx
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: shonenx

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-videos
  - --filesystem=xdg-documents
  - --filesystem=xdg-run/pipewire-0:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/bash-completion
      - /share/zsh
      - /share/doc
      - /share/icons
      - /share/applications
      - /share/man
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Ddebug=false
      - -Dbuild-date=false
      - -Dalsa=disabled
      - -Dmanpage-build=disabled
      - -Dvulkan=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
        sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3
    modules:
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dopengl=enabled
          - -Dvulkan=disabled
          - -Dglslang=disabled
          - -Dd3d11=disabled
          - -Ddemos=False
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: archive
            url: https://code.videolan.org/videolan/libplacebo/-/archive/v7.360.1/libplacebo-v7.360.1.tar.gz
            sha256: 14c0a99f4b01557ec9826ce6b1d52f6de21be274ba03fd5aab7307f18766dc39
          - type: archive
            url: https://github.com/pallets/jinja/archive/refs/tags/3.1.6.tar.gz
            sha256: 2074b22a72caa65474902234b320d73463d6d4c223ee49f4b433495758356337
            dest: 3rdparty/jinja
          - type: archive
            url: https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.8.tar.gz
            sha256: 44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc
            dest: 3rdparty/glad

      - name: libass
        config-opts:
          - --disable-static
        cleanup:
          - /include
          - /lib/pkgconfig
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.gz
            sha256: da7c348deb6fa6c24507afab2dee7545ba5dd5bbf90a137bfe9e738f7df68537

  - name: shonenx
    buildsystem: simple
    build-commands:
      # Copy the Flutter Linux release bundle
      - install -d /app/lib/shonenx
      - cp -r bundle/* /app/lib/shonenx/
      # Install wrapper launcher
      - install -Dm755 shonenx.sh /app/bin/shonenx
      # Install desktop integration, icon, and metainfo
      - install -Dm644 com.roshancodespace.shonenx.desktop /app/share/applications/com.roshancodespace.shonenx.desktop
      - install -Dm644 com.roshancodespace.shonenx.metainfo.xml /app/share/metainfo/com.roshancodespace.shonenx.metainfo.xml
      - install -Dm644 com.roshancodespace.shonenx.png /app/share/icons/hicolor/256x256/apps/com.roshancodespace.shonenx.png
    sources:
      - type: dir
        path: bundle
        dest: bundle
      - type: file
        path: shonenx.sh
      - type: file
        path: com.roshancodespace.shonenx.desktop
      - type: file
        path: com.roshancodespace.shonenx.metainfo.xml
      - type: file
        path: com.roshancodespace.shonenx.png
